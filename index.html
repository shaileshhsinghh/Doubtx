<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login/Signup Form</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #111827, #0f172a);
    }
    .container {
      position: relative;
      width: 850px; height: 550px;
      background: #fff;
      border-radius: 30px;
      box-shadow: 0 0 30px rgba(0, 0, 0, .2);
      overflow: hidden;
    }
    .form-box {
      position: absolute; right: 0; width: 50%; height: 100%;
      background: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column;
      padding: 40px; z-index: 1;
      transition: .6s ease-in-out 1.2s, visibility 0s 1s;
    }
    .container.active .form-box { right: 50%; }
    .form-box.register { visibility: hidden; }
    .container.active .form-box.register { visibility: visible; }
    .form-box h1 { margin-bottom: 20px; font-size: 32px; }
    .input-box {
      position: relative; margin-bottom: 20px; width: 100%;
    }
    .input-box input, .input-box select {
      width: 100%; padding: 13px 20px;
      background: #eee; border-radius: 8px; border: none;
      font-size: 16px; color: #333;
    }
    .input-box i {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      font-size: 20px;
    }
    .btn {
      width: 100%; height: 48px;
      background: #7494ec; border-radius: 8px;
      border: none; cursor: pointer; font-size: 16px; color: #fff; font-weight: 600;
    }
    .toggle-box {
      position: absolute; width: 100%; height: 100%;
    }
    .toggle-box::before {
      content: ''; position: absolute; left: -250%;
      width: 300%; height: 100%;
      background: #7494ec;
      border-radius: 150px; z-index: 2;
      transition: 1.8s ease-in-out;
    }
    .container.active .toggle-box::before { left: 50%; }
    .toggle-panel {
      position: absolute; width: 50%; height: 100%;
      color: #fff; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 2; transition: .6s ease-in-out;
    }
    .toggle-panel.toggle-left { left: 0; }
    .container.active .toggle-panel.toggle-left { left: -50%; }
    .toggle-panel.toggle-right { right: -50%; }
    .container.active .toggle-panel.toggle-right { right: 0; }
    .toggle-panel h1 { font-size: 28px; margin-bottom: 10px; }
    .toggle-panel p { margin-bottom: 20px; }
    .toggle-panel .btn {
      width: 160px; height: 46px;
      background: transparent; border: 2px solid #fff;
    }
    .branding {
      position: absolute; top: 20px; left: 30px;
      font-size: 24px; font-weight: 700; color: #fff; z-index: 99;
    }
    .branding span { color: #8A2BE2; }
  </style>
</head>
<body>
  <div class="branding">DOUBT<span>X</span></div>
  <div class="container">
    <!-- Login Form -->
    <div class="form-box login">
      <form>
        <h1>Login</h1>
        <div class="input-box">
          <input type="text" placeholder="Username" required />
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
          <input type="password" placeholder="Password" required />
          <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="input-box">
          <select name="role" required>
            <option value="" disabled selected>Select Role</option>
            <option value="student">Student</option>
            <option value="tutor">Tutor</option>
          </select>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- Register Form -->
    <div class="form-box register">
      <form>
        <h1>Register</h1>
        <div class="input-box">
          <input type="text" placeholder="Username" required />
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
          <input type="password" placeholder="Password" required />
          <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="input-box">
          <select name="role" required>
            <option value="" disabled selected>Select Role</option>
            <option value="student">Student</option>
            <option value="tutor">Tutor</option>
          </select>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
    </div>

    <!-- Toggle Panel -->
    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1>Hello, Welcome!</h1>
        <p>Don't have an account?</p>
        <button class="btn register-btn">Register</button>
      </div>
      <div class="toggle-panel toggle-right">
        <h1>Welcome Back!</h1>
        <p>Already have an account?</p>
        <button class="btn login-btn">Login</button>
      </div>
    </div>
  </div>
  <script src="response.js"></script>
</body>
</html>
