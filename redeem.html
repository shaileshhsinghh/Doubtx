<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merit Redemption - DoubtX</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
    button {
      transition: all 0.2s ease-in-out;
    }
    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <!-- Navbar -->
  <nav class="p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-white">
      Doubt<span class="text-purple-400">X</span>
    </h1>
    <a href="dashboard.html" class="text-sm bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-medium transition">
      ⬅ Back to Dashboard
    </a>
  </nav>

  <main class="flex items-center justify-center py-16 px-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold mb-4 text-center">🎁 Redeem Your Merits</h1>
      <p class="text-gray-300 text-center mb-6">1 Merit = ₹1. Enter the number of merits you want to redeem.</p>

      <form id="redeemForm" class="space-y-4">
        <div>
          <label for="merits" class="block mb-2 text-sm font-medium">Merits to Redeem</label>
          <input type="number" id="merits" name="merits" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-purple-500" min="1" required>
        </div>

        <button type="submit" class="w-full bg-yellow-500 text-black font-semibold py-3 px-4 rounded-lg hover:bg-yellow-600">Redeem Now</button>
      </form>

      <p id="message" class="mt-4 text-center text-green-400 hidden"></p>
    </div>
  </main>

  <script>
    const form = document.getElementById('redeemForm');
    const message = document.getElementById('message');
    const username = localStorage.getItem('username');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const amount = parseInt(document.getElementById('merits').value);
      const res = await fetch('/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, amount })
      });

      const data = await res.json();
      if (res.ok) {
        message.textContent = data.message;
        message.classList.remove('hidden', 'text-red-400');
        message.classList.add('text-green-400');
        localStorage.setItem('merits', parseInt(localStorage.getItem('merits')) - amount);
      } else {
        message.textContent = data.message;
        message.classList.remove('text-green-400', 'hidden');
        message.classList.add('text-red-400');
      }
    });
  </script>
</body>
</html>
